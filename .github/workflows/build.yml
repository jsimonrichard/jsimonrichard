name: Build

on:
  push:
  pull_request:
    paths-ignore:
      - README.md

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - name: Install resume fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          curl -fsSL -o /tmp/libertinus.zip \
            https://github.com/alerque/libertinus/releases/download/v7.051/Libertinus-7.051.zip
          sudo unzip -j /tmp/libertinus.zip \
            Libertinus-7.051/static/OTF/LibertinusSerif-Regular.otf \
            Libertinus-7.051/static/OTF/LibertinusSerif-Bold.otf \
            Libertinus-7.051/static/OTF/LibertinusSerif-Italic.otf \
            -d /usr/local/share/fonts
          fc-cache -f
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload preview version
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
